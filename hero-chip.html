<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hero — chip de computadora (partículas)</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden}
  body{
    background:
      radial-gradient(120% 95% at 38% 32%, #1d4e8f 0%, #123a72 26%, #0b2553 50%, #07173a 74%, #040d22 100%);
  }
  #c{display:block;width:100vw;height:100vh;position:relative;z-index:1;cursor:crosshair}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
var V=THREE.Vector3;

// ── texturas de punto (reutilizadas de cpu-demo / brain-real) ──
function dotTexture(){var s=64,c=document.createElement('canvas');c.width=c.height=s;var g=c.getContext('2d');
  var rg=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);rg.addColorStop(0,'rgba(255,255,255,1)');
  rg.addColorStop(0.35,'rgba(210,235,255,0.9)');rg.addColorStop(0.7,'rgba(120,170,255,0.25)');
  rg.addColorStop(1,'rgba(80,140,255,0)');g.fillStyle=rg;g.beginPath();g.arc(s/2,s/2,s/2,0,Math.PI*2);g.fill();
  return new THREE.CanvasTexture(c);}
function softTex(){var s=64,c=document.createElement('canvas');c.width=c.height=s;var g=c.getContext('2d');
  var rg=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);rg.addColorStop(0,'rgba(150,200,255,0.55)');
  rg.addColorStop(0.5,'rgba(110,160,255,0.18)');rg.addColorStop(1,'rgba(80,140,255,0)');
  g.fillStyle=rg;g.beginPath();g.arc(s/2,s/2,s/2,0,Math.PI*2);g.fill();return new THREE.CanvasTexture(c);}
var TEX=dotTexture(), TEXS=softTex();

// ── GEOMETRÍA: CPU 3D con disipador (reutilizado de cpu-demo build('heatsink')) ──
function build(){
  var nodes=[], segs=[];
  function trace(a,b){segs.push(a,b);}
  function L(path){for(var i=0;i<path.length-1;i++)trace(path[i],path[i+1]);}
  function rect(cx,cy,cz,w,h,plane){
    var hw=w/2,hh=h/2,p;
    if(plane==='xy')p=[new V(cx-hw,cy-hh,cz),new V(cx+hw,cy-hh,cz),new V(cx+hw,cy+hh,cz),new V(cx-hw,cy+hh,cz)];
    else p=[new V(cx-hw,cy,cz-hh),new V(cx+hw,cy,cz-hh),new V(cx+hw,cy,cz+hh),new V(cx-hw,cy,cz+hh)];
    L([p[0],p[1],p[2],p[3],p[0]]); return p;
  }
  function node(p){nodes.push(p);}
  function box(cx,cy,cz,w,h,d){
    var hh=h/2;
    var t=rect(cx,cy+hh,cz,w,d,'xz'), b=rect(cx,cy-hh,cz,w,d,'xz');
    for(var i=0;i<4;i++)trace(t[i],b[i]);
    return {top:t,bot:b};
  }

  var s=0.62,bh=0.16;
  box(0,0,0,s*2,bh*2,s*2);                         // cuerpo del chip
  rect(0,bh+0.001,0,s*1.0,s*1.0,'xz');             // die metálico encima
  node(new V(0,bh+0.02,0));
  // grilla de circuitos sobre el die
  for(var k=-2;k<=2;k++){
    trace(new V(k*0.16,bh+0.002,-s*0.46),new V(k*0.16,bh+0.002,s*0.46));
    trace(new V(-s*0.46,bh+0.002,k*0.16),new V(s*0.46,bh+0.002,k*0.16));
  }
  // aletas del disipador
  for(var k=-3;k<=3;k++){var x=k*0.16;
    L([new V(x,bh,-s*0.55),new V(x,bh+0.5,-s*0.55),new V(x,bh+0.5,s*0.55),new V(x,bh,s*0.55)]);
  }
  // patas a los 4 lados (más completas que el demo)
  for(var side=0;side<4;side++)for(var k=-2;k<=2;k++){
    var off=k*0.24,p,d;
    if(side===0){p=new V(off,-bh,-s);d=new V(off,-bh-0.30,-s);}
    else if(side===1){p=new V(off,-bh,s);d=new V(off,-bh-0.30,s);}
    else if(side===2){p=new V(-s,-bh,off);d=new V(-s,-bh-0.30,off);}
    else {p=new V(s,-bh,off);d=new V(s,-bh-0.30,off);}
    trace(p,d); node(d);
  }
  return {nodes:nodes, segs:segs};
}

var canvas=document.getElementById('c');
var renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true,alpha:true});
renderer.setClearColor(0x000000,0); renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
var scene=new THREE.Scene(); var cam=new THREE.PerspectiveCamera(42,1,0.1,100); cam.position.set(0,0,4.2);
function resize(){var W=innerWidth,H=innerHeight;renderer.setSize(W,H);cam.aspect=W/H;cam.updateProjectionMatrix();}
resize(); addEventListener('resize',resize);

var g=new THREE.Group(); scene.add(g); g.scale.setScalar(1.25);
var data=build();

// ── 1) LÍNEAS de las trazas ──
var lgeo=new THREE.BufferGeometry().setFromPoints(data.segs);
var matLines=new THREE.LineBasicMaterial({color:0x5ba6ff,transparent:true,opacity:0.55,blending:THREE.AdditiveBlending,depthWrite:false});
g.add(new THREE.LineSegments(lgeo,matLines));

// ── 2) NODOS brillantes ──
var np=new Float32Array(data.nodes.length*3);
data.nodes.forEach(function(p,i){np[i*3]=p.x;np[i*3+1]=p.y;np[i*3+2]=p.z;});
var ngeo=new THREE.BufferGeometry(); ngeo.setAttribute('position',new THREE.BufferAttribute(np,3));
var matNodes=new THREE.PointsMaterial({color:0xffffff,size:0.13,map:TEX,transparent:true,opacity:0.95,blending:THREE.AdditiveBlending,depthWrite:false});
g.add(new THREE.Points(ngeo,matNodes));

// ── 3) RELLENO DENSO de trazas (capa que deforman las ondas del cursor) ──
var fill=[], PER=11;
for(var si=0;si<data.segs.length;si+=2){
  var a=data.segs[si],b=data.segs[si+1];
  for(var t=0;t<PER;t++){var f=(t+0.5)/PER;fill.push(a.x+(b.x-a.x)*f,a.y+(b.y-a.y)*f,a.z+(b.z-a.z)*f);}
}
var NF=fill.length/3;
var fillArr=new Float32Array(fill), fillBase=new Float32Array(fill);
var fgeo=new THREE.BufferGeometry(); fgeo.setAttribute('position',new THREE.BufferAttribute(fillArr,3));
var matFill=new THREE.PointsMaterial({color:0xbfe0ff,size:0.05,map:TEX,transparent:true,opacity:0.8,blending:THREE.AdditiveBlending,depthWrite:false});
g.add(new THREE.Points(fgeo,matFill));

// ── 4) GLOW volumétrico alrededor del cuerpo del chip ──
var NG=800, gp=new Float32Array(NG*3);
for(var i=0;i<NG;i++){
  // nube elipsoidal achatada que envuelve el chip
  var u=Math.random(),v=Math.random();
  var th=Math.acos(2*u-1),ph=2*Math.PI*v, r=0.55+Math.random()*0.55;
  gp[i*3]=Math.sin(th)*Math.cos(ph)*r*1.15;
  gp[i*3+1]=Math.cos(th)*r*0.55;
  gp[i*3+2]=Math.sin(th)*Math.sin(ph)*r*1.15;
}
var glgeo=new THREE.BufferGeometry(); glgeo.setAttribute('position',new THREE.BufferAttribute(gp,3));
var matGlow=new THREE.PointsMaterial({color:0x7cc0ff,size:0.11,map:TEXS,transparent:true,opacity:0.5,blending:THREE.AdditiveBlending,depthWrite:false});
g.add(new THREE.Points(glgeo,matGlow));

// ── 5) AMBIENTALES flotando ──
var AMB=120, ap=new Float32Array(AMB*3), abase=new Float32Array(AMB*3), adr=new Float32Array(AMB);
for(var i=0;i<AMB;i++){abase[i*3]=(Math.random()*2-1)*1.9;abase[i*3+1]=(Math.random()*2-1)*1.3;abase[i*3+2]=(Math.random()*2-1)*1.3;
  ap[i*3]=abase[i*3];ap[i*3+1]=abase[i*3+1];ap[i*3+2]=abase[i*3+2];adr[i]=Math.random()*Math.PI*2;}
var amgeo=new THREE.BufferGeometry(); amgeo.setAttribute('position',new THREE.BufferAttribute(ap,3));
var matAmb=new THREE.PointsMaterial({color:0x7fb0ff,size:0.04,map:TEX,transparent:true,opacity:0.45,blending:THREE.AdditiveBlending,depthWrite:false});
g.add(new THREE.Points(amgeo,matAmb));

// ── 6) PULSOS de energía por las trazas (vienen gratis, aportan vida) ──
var PN=Math.min(60, data.segs.length/2|0);
var pp=new Float32Array(PN*3), pg=new THREE.BufferGeometry();
pg.setAttribute('position',new THREE.BufferAttribute(pp,3));
g.add(new THREE.Points(pg,new THREE.PointsMaterial({color:0xeaf6ff,size:0.09,map:TEX,transparent:true,opacity:0.95,blending:THREE.AdditiveBlending,depthWrite:false})));
var pulses=[];
function spawn(o){o.i=((Math.random()*data.segs.length/2)|0)*2;o.t=0;o.sp=0.5+Math.random()*1.4;}
for(var i=0;i<PN;i++){var o={};spawn(o);pulses.push(o);}

// ── ONDAS LOCALES AL CURSOR (portado de brain-real) ──
var ray=new THREE.Raycaster(), mouseNDC=new THREE.Vector2();
var hitPlane=new THREE.Plane(new THREE.Vector3(0,0,1),0), tmpHit=new THREE.Vector3();
var ripples=[], lastRipple=0;
function spawnRipple(clientX,clientY,now){
  mouseNDC.x=(clientX/innerWidth)*2-1; mouseNDC.y=-(clientY/innerHeight)*2+1;
  ray.setFromCamera(mouseNDC,cam);
  if(!ray.ray.intersectPlane(hitPlane,tmpHit)) return;
  var local=g.worldToLocal(tmpHit.clone());
  if(local.length()>2.2) return;
  ripples.push({p:local,t0:now});
  if(ripples.length>6) ripples.shift();
}
addEventListener('pointermove',function(e){
  var now=performance.now()/1000;
  if(now-lastRipple<0.09) return; lastRipple=now;
  spawnRipple(e.clientX,e.clientY,now);
});
var RIP_RADIUS=0.45, RIP_PUSH=0.12, RIP_LIFE=0.6;
function updateRipples(T){
  for(var r=ripples.length-1;r>=0;r--){ if(T-ripples[r].t0>RIP_LIFE) ripples.splice(r,1); }
  var pos=fgeo.attributes.position.array;
  for(var i=0;i<NF;i++){
    var bx=fillBase[i*3], by=fillBase[i*3+1], bz=fillBase[i*3+2];
    var dx=0,dy=0,dz=0;
    for(var r=0;r<ripples.length;r++){
      var R=ripples[r], age=T-R.t0;
      var ex=bx-R.p.x, ey=by-R.p.y, ez=bz-R.p.z;
      var dist=Math.sqrt(ex*ex+ey*ey+ez*ez)+1e-5;
      if(dist>RIP_RADIUS) continue;
      var falloff=Math.exp(-(dist*dist)/(RIP_RADIUS*RIP_RADIUS*0.35));
      var pulse=Math.sin((age/RIP_LIFE)*Math.PI);
      var amp=falloff*Math.max(0,pulse);
      var k=RIP_PUSH*amp/dist;
      dx+=ex*k; dy+=ey*k; dz+=ez*k;
    }
    pos[i*3]=bx+dx; pos[i*3+1]=by+dy; pos[i*3+2]=bz+dz;
  }
  fgeo.attributes.position.needsUpdate=true;
}

// ── LOOP: vista isométrica con oscilación suave (no giro completo) ──
var clock=new THREE.Clock(),T=0;
(function loop(){requestAnimationFrame(loop);var dt=clock.getDelta();T+=dt;
  g.rotation.y=-0.5+Math.sin(T*0.18)*0.35;        // mece manteniendo la vista 3D
  g.rotation.x=-0.45+Math.sin(T*0.14)*0.07;
  // pulsos por las trazas
  for(var k=0;k<PN;k++){var o=pulses[k];o.t+=dt*o.sp;if(o.t>=1)spawn(o);
    var a=data.segs[o.i],b=data.segs[o.i+1];
    pp[k*3]=a.x+(b.x-a.x)*o.t;pp[k*3+1]=a.y+(b.y-a.y)*o.t;pp[k*3+2]=a.z+(b.z-a.z)*o.t;}
  pg.attributes.position.needsUpdate=true;
  // ambientales a la deriva
  for(var i=0;i<AMB;i++){var ph=adr[i];
    ap[i*3]=abase[i*3]+Math.sin(T*0.5+ph)*0.07;
    ap[i*3+1]=abase[i*3+1]+Math.cos(T*0.45+ph)*0.07;
    ap[i*3+2]=abase[i*3+2]+Math.sin(T*0.6+ph*1.3)*0.07;}
  amgeo.attributes.position.needsUpdate=true;
  matGlow.opacity=0.42+0.12*Math.sin(T*0.9);      // glow respira
  matNodes.opacity=0.8+0.15*Math.sin(T*1.6);      // nodos titilan
  updateRipples(T);                               // ondas locales al cursor
  renderer.render(scene,cam);})();
</script>
</body>
</html>
