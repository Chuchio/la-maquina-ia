<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cerebro de partículas — estilo Dala</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden}
  body{background:radial-gradient(120% 95% at 42% 36%, #16407e 0%, #0e2f63 30%, #0a2049 55%, #061536 78%, #030b1f 100%);}
  #c{display:block;width:100vw;height:100vh}
  .hint{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:5;
    font-family:system-ui,sans-serif;font-size:12px;letter-spacing:.06em;color:#7fa8e0;opacity:.7}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint">mové el cursor · click para re-ensamblar</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
var V=THREE.Vector3;

// ── sprite de partícula (glow redondo) ──
function dotTex(){var s=64,c=document.createElement('canvas');c.width=c.height=s;var g=c.getContext('2d');
  var rg=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);rg.addColorStop(0,'rgba(255,255,255,1)');
  rg.addColorStop(0.35,'rgba(220,238,255,0.9)');rg.addColorStop(0.7,'rgba(140,190,255,0.25)');rg.addColorStop(1,'rgba(90,150,255,0)');
  g.fillStyle=rg;g.beginPath();g.arc(s/2,s/2,s/2,0,Math.PI*2);g.fill();return new THREE.CanvasTexture(c);}
var TEX=dotTex();

// ── ruido fractal + domain warping (surcos) ──
function hash3(x,y,z){var n=Math.sin(x*127.1+y*311.7+z*74.7)*43758.5453;return n-Math.floor(n);}
function vnoise(x,y,z){var xi=Math.floor(x),yi=Math.floor(y),zi=Math.floor(z),xf=x-xi,yf=y-yi,zf=z-zi;
  function f(t){return t*t*(3-2*t);}var u=f(xf),v=f(yf),w=f(zf);function lp(a,b,t){return a+(b-a)*t;}
  return lp(lp(lp(hash3(xi,yi,zi),hash3(xi+1,yi,zi),u),lp(hash3(xi,yi+1,zi),hash3(xi+1,yi+1,zi),u),v),
            lp(lp(hash3(xi,yi,zi+1),hash3(xi+1,yi,zi+1),u),lp(hash3(xi,yi+1,zi+1),hash3(xi+1,yi+1,zi+1),u),v),w);}
function fbm(x,y,z){var s=0,a=0.5,fr=1;for(var o=0;o<4;o++){s+=a*vnoise(x*fr,y*fr,z*fr);fr*=2;a*=0.5;}return s;}
function sulci(x,y,z){var wx=fbm(x*1.5+1.3,y*1.5+4.2,z*1.5+2.1),wy=fbm(x*1.5+7.1,y*1.5+1.7,z*1.5+9.2);
  var n=fbm(x*2.2+wx*2.4,y*2.2+wy*2.4,z*2.2);return 1-Math.abs(2*n-1);}

/* ── SUPERFICIE DE CEREBRO 3D ANATÓMICO (válida desde cualquier ángulo) ──
   Dos hemisferios + fisura interhemisférica + lóbulos + surcos. */
function brainSurface3D(nx,ny,nz){
  var x=nx*0.92, y=ny*0.80, z=nz*1.32;          // elipsoide: largo Z (frente↔nuca)
  if(y<0) y*=0.66; else y*=1.04;                 // base plana, tope abultado
  z += -0.12*y;                                  // lóbulo frontal levantado
  var taper=1-0.16*(z*z)/(1.32*1.32); x*=taper;  // estrechar puntas
  var rad=Math.sqrt(x*x+y*y+z*z)+1e-5, dr=0;
  var fis=Math.exp(-(x*x)/0.05);                 // fisura central
  dr += -0.30*fis*Math.max(0,(y+0.05));
  x  += (x>0?1:-1)*0.10*fis;
  var rg=sulci(x,y,z); dr += (rg-0.5)*0.18;      // surcos
  var k=(rad+dr)/rad; return new V(x*k,y*k,z*k);
}
function randDir(){var u=Math.random(),v=Math.random();var th=Math.acos(2*u-1),ph=2*Math.PI*v;
  return [Math.sin(th)*Math.cos(ph),Math.cos(th),Math.sin(th)*Math.sin(ph)];}
function sampleSurface(){for(var t=0;t<8;t++){var d=randDir();var p=brainSurface3D(d[0],d[1],d[2]);
  var rg=sulci(p.x,p.y,p.z);if(Math.random()<0.2+0.8*rg*rg)return p;}return brainSurface3D(0,1,0);}

// ── escena ──
var canvas=document.getElementById('c');
var renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true,alpha:true});
renderer.setClearColor(0x000000,0); var DPR=Math.min(devicePixelRatio||1,2); renderer.setPixelRatio(DPR);
var scene=new THREE.Scene();
var cam=new THREE.PerspectiveCamera(45,1,0.1,100); cam.position.set(0,0,4.6);
function resize(){var W=innerWidth,H=innerHeight;renderer.setSize(W,H);cam.aspect=W/H;cam.updateProjectionMatrix();}
resize(); addEventListener('resize',resize);

var group=new THREE.Group(); scene.add(group); group.scale.setScalar(1.5);

// ── geometría: home (cerebro) + scatter (disperso) + seeds para depth/stagger ──
var N=45000;
var home=new Float32Array(N*3), scatter=new Float32Array(N*3), aseed=new Float32Array(N), arnd=new Float32Array(N);
for(var i=0;i<N;i++){
  var p=sampleSurface(); home[i*3]=p.x; home[i*3+1]=p.y; home[i*3+2]=p.z;
  // dispersión inicial: cascarón esférico grande aleatorio
  var d=randDir(), R=3.2+Math.random()*3.0;
  scatter[i*3]=d[0]*R; scatter[i*3+1]=d[1]*R; scatter[i*3+2]=d[2]*R;
  aseed[i]=Math.random();      // stagger del ensamblaje
  arnd[i]=0.6+Math.random()*0.8; // variación de tamaño
}
var geo=new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(N*3),3)); // se llena por shader
geo.setAttribute('aHome', new THREE.BufferAttribute(home,3));
geo.setAttribute('aScatter', new THREE.BufferAttribute(scatter,3));
geo.setAttribute('aSeed', new THREE.BufferAttribute(aseed,1));
geo.setAttribute('aRnd', new THREE.BufferAttribute(arnd,1));

// ── ShaderMaterial: assemble + depth-of-field + repulsión mouse ──
var uniforms={
  uAssemble:{value:0}, uTime:{value:0},
  uTex:{value:TEX}, uPx:{value:DPR},
  uMouse:{value:new THREE.Vector3(99,99,99)}, uMouseOn:{value:0},
  uColNear:{value:new THREE.Color(0xffffff)}, uColFar:{value:new THREE.Color(0x2f6ad0)},
  uSize:{value:15.0}
};
var vert=`
  attribute vec3 aHome; attribute vec3 aScatter; attribute float aSeed; attribute float aRnd;
  uniform float uAssemble, uTime, uPx, uSize, uMouseOn;
  uniform vec3 uMouse;
  varying float vDepth; varying float vRnd;
  // ease per-partícula con stagger
  float ease(float t){ return t*t*(3.0-2.0*t); }
  void main(){
    float a = clamp((uAssemble - aSeed*0.6)/0.4, 0.0, 1.0);  // stagger
    a = ease(a);
    vec3 pos = mix(aScatter, aHome, a);
    // ── FLUJO/CORRIENTE continua sobre la superficie (cuando ya está armado) ──
    float fl = a;
    vec3 h = aHome;
    // campo de flujo: dirección tangente que varía con la posición y el tiempo
    vec3 axis = normalize(vec3(0.2, 1.0, 0.1));
    vec3 tang = normalize(cross(axis, h) + 1e-4);          // corre alrededor del eje
    float wave = sin(h.y*4.0 + h.x*3.0 - uTime*0.9 + aSeed*6.28);
    float swirl = sin(h.x*5.0 + h.z*4.0 + uTime*0.6);
    pos += tang * (0.05 * wave) * fl;                       // corriente a lo largo de la superficie
    pos += normalize(h) * (0.018 * swirl) * fl;            // leve latido radial
    // micro-jitter vivo
    pos += vec3(sin(uTime*0.7+aSeed*30.0), cos(uTime*0.6+aSeed*21.0), sin(uTime*0.8+aSeed*12.0)) * 0.008 * fl;
    // repulsión del mouse (en espacio local del grupo, aproximada por distancia 3D)
    if(uMouseOn>0.5){
      vec3 dlt = pos - uMouse;
      float d = length(dlt);
      float R = 0.7;
      if(d < R){ float f=(1.0-d/R); f=f*f; pos += normalize(dlt)*f*0.45; }
    }
    vec4 mv = modelViewMatrix * vec4(pos,1.0);
    vDepth = -mv.z;                  // profundidad (mayor = más lejos)
    vRnd = aRnd;
    gl_Position = projectionMatrix * mv;
    // depth-of-field: tamaño cae con la distancia (sizeAttenuation) y con aRnd
    gl_PointSize = uSize * aRnd * uPx * (1.0/ -mv.z) * (0.6 + 0.4*a);
  }`;
var frag=`
  uniform sampler2D uTex; uniform vec3 uColNear, uColFar;
  varying float vDepth; varying float vRnd;
  void main(){
    vec4 t = texture2D(uTex, gl_PointCoord);
    if(t.a < 0.02) discard;
    // near (vDepth~3) brillante/blanco, far (vDepth~6+) tenue/azul
    float dn = clamp((vDepth-3.2)/3.2, 0.0, 1.0);
    vec3 col = mix(uColNear, uColFar, dn);
    float alpha = t.a * mix(1.0, 0.35, dn);     // atrás más transparente (depth-of-field)
    gl_FragColor = vec4(col, alpha);
  }`;
var mat=new THREE.ShaderMaterial({
  uniforms:uniforms, vertexShader:vert, fragmentShader:frag,
  transparent:true, depthWrite:false, blending:THREE.AdditiveBlending
});
group.add(new THREE.Points(geo, mat));

// ── ensamblaje ──
var assemble=0, tgtAssemble=1, assembleStart=performance.now();
function triggerAssemble(){ assemble=0; tgtAssemble=1; assembleStart=performance.now(); }
addEventListener('click', triggerAssemble);

// ── mouse: parallax + punto de repulsión proyectado al plano del cerebro ──
var ray=new THREE.Raycaster(), mNDC=new THREE.Vector2(99,99), mActive=false, mLast=0;
var plane=new THREE.Plane(new THREE.Vector3(0,0,1),0), tmpHit=new THREE.Vector3();
var tRotX=0,tRotY=0,cRotX=0,cRotY=0;
addEventListener('pointermove',function(e){
  var mx=(e.clientX/innerWidth)*2-1, my=-(e.clientY/innerHeight)*2+1;
  tRotY=mx*0.25; tRotX=my*0.16;
  mNDC.set(mx,my); mActive=true; mLast=performance.now();
});
addEventListener('pointerleave',function(){mActive=false;});

var clock=new THREE.Clock(), T=0;
function animate(){
  requestAnimationFrame(animate);
  var dt=Math.min(clock.getDelta(),0.05); T+=dt;
  // assemble progresa sobre ~2.6s
  assemble += (tgtAssemble-assemble)* (1-Math.pow(0.001, dt)); // suave
  var prog=Math.min(1,(performance.now()-assembleStart)/2600);
  uniforms.uAssemble.value = prog;
  uniforms.uTime.value = T;

  // rotación 3D lenta + parallax del mouse
  cRotX+=(tRotX-cRotX)*0.05; cRotY+=(tRotY-cRotY)*0.05;
  group.rotation.y = T*0.16 + cRotY;
  group.rotation.x = -0.12 + cRotX + Math.sin(T*0.13)*0.05;
  group.updateMatrixWorld();

  // punto del mouse → mundo (plano z=0) → local del grupo
  if(mActive && performance.now()-mLast<250){
    ray.setFromCamera(mNDC,cam);
    if(ray.ray.intersectPlane(plane,tmpHit)){
      var local=group.worldToLocal(tmpHit.clone());
      uniforms.uMouse.value.copy(local); uniforms.uMouseOn.value=1;
    }
  } else uniforms.uMouseOn.value=0;

  renderer.render(scene,cam);
}
animate();
</script>
</body>
</html>
