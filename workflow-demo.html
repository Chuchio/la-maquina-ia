<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Workflow IA — 5 variantes</title>
<style>
  html,body{margin:0;background:#02060f;color:#cfe0ff;font-family:'Plus Jakarta Sans',system-ui,sans-serif}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:2px;background:#0b1020}
  .cell{position:relative;aspect-ratio:16/10;background:#040b1c;overflow:hidden}
  .cell:nth-child(5){grid-column:1 / span 2;aspect-ratio:32/10}
  .cell canvas{display:block;width:100%;height:100%}
  .lbl{position:absolute;top:12px;left:14px;z-index:3;font-size:12px;font-weight:700;letter-spacing:.05em;
    text-transform:uppercase;color:#9cc4ff;text-shadow:0 1px 6px #000}
</style>
</head>
<body>
<div class="grid">
  <div class="cell"><div class="lbl">1 · Clon n8n (glow intenso)</div><canvas data-v="clone"></canvas></div>
  <div class="cell"><div class="lbl">2 · Limpio / producto</div><canvas data-v="clean"></canvas></div>
  <div class="cell"><div class="lbl">3 · Ortogonal (circuito)</div><canvas data-v="ortho"></canvas></div>
  <div class="cell"><div class="lbl">4 · Azul de marca (sobrio)</div><canvas data-v="brand"></canvas></div>
  <div class="cell"><div class="lbl">5 · Energía / flujo intenso</div><canvas data-v="energy"></canvas></div>
</div>

<script>
// ════════ DEFINICIÓN DEL GRAFO (compartida por las 5 variantes) ════════
var NODES=[
  {id:'webhook', x:0.06, y:0.30, label:'Webhook',  sub:'TRIGGER',      ic:'webhook', w:120, step:0},
  {id:'agent',   x:0.27, y:0.30, label:'AI Agent', sub:'TOOLS AGENT',  ic:'agent', core:1, w:140, step:1},
  {id:'switch',  x:0.50, y:0.30, label:'Router',   sub:'SWITCH',       ic:'router', w:120, step:2},
  {id:'gemini',  x:0.135,y:0.62, label:'Gemini',   sub:'CHAT MODEL',   ic:'gemini', w:124, step:3},
  {id:'memory',  x:0.30, y:0.62, label:'Memory',   sub:'BUFFER',       ic:'mem',    w:118, step:3},
  {id:'openai',  x:0.45, y:0.62, label:'OpenAI',   sub:'API · GPT',    ic:'openai', w:120, step:3},
  {id:'subagent',x:0.30, y:0.90, label:'Structured',sub:'OUTPUT AGENT',ic:'agent', core:1, w:148, step:4},
  {id:'chat2',   x:0.135,y:0.90, label:'Chat',     sub:'MODEL',        ic:'gemini', w:110, step:5},
  {id:'parser',  x:0.47, y:0.90, label:'Parser',   sub:'OUTPUT',       ic:'parser', w:114, step:5},
  {id:'h1', x:0.70, y:0.14, sq:1, ic:'http', step:3},
  {id:'r1', x:0.86, y:0.14, sq:1, ic:'code', step:4},
  {id:'h2', x:0.70, y:0.30, sq:1, ic:'http', step:3},
  {id:'r2', x:0.86, y:0.30, sq:1, ic:'http', step:4},
  {id:'h3', x:0.70, y:0.46, sq:1, ic:'http', step:3},
  {id:'r3', x:0.86, y:0.46, sq:1, ic:'http', step:4}
];
var EDGES=[
  ['webhook','agent'],['agent','switch'],
  ['gemini','agent'],['memory','agent'],['openai','agent'],
  ['agent','subagent'],['chat2','subagent'],['parser','subagent'],
  ['switch','h1'],['switch','h2'],['switch','h3'],
  ['h1','r1'],['h2','r2'],['h3','r3']
];

// ── íconos dibujados con Path2D (vectoriales, nítidos en canvas) ──
function drawIcon(ctx,name,cx,cy,s,col){
  ctx.save(); ctx.translate(cx,cy); ctx.scale(s/24,s/24); ctx.translate(-12,-12);
  ctx.strokeStyle=col; ctx.fillStyle=col; ctx.lineWidth=2; ctx.lineCap='round'; ctx.lineJoin='round';
  var p=new Path2D();
  if(name==='webhook'){ p.moveTo(9,17);p.arc(9,12,5,Math.PI*0.5,Math.PI*1.9,false); ctx.stroke(p);
    var c=new Path2D();c.arc(6,17,2.4,0,7);c.moveTo(20,6);c.arc(18,6,2.4,0,7);ctx.stroke(c); }
  else if(name==='agent'){ roundRectP(p,4,7,16,12,3);p.moveTo(12,7);p.lineTo(12,3.5);ctx.stroke(p);
    dot(ctx,8.5,13);dot(ctx,15.5,13); var m=new Path2D();m.moveTo(9,16.5);m.lineTo(15,16.5);ctx.stroke(m); }
  else if(name==='router'){ line(ctx,4,7,14,7);line(ctx,4,12,11,12);line(ctx,4,17,14,17);
    line(ctx,14,7,18,7);line(ctx,14,17,18,17);dot(ctx,19,7,1.6);dot(ctx,19,17,1.6); }
  else if(name==='gemini'){ p.moveTo(12,3);p.bezierCurveTo(12.5,7.5,16.5,11.5,21,12);p.bezierCurveTo(16.5,12.5,12.5,16.5,12,21);
    p.bezierCurveTo(11.5,16.5,7.5,12.5,3,12);p.bezierCurveTo(7.5,11.5,11.5,7.5,12,3);ctx.stroke(p); }
  else if(name==='mem'){ roundRectP(p,5,5,14,14,2);ctx.stroke(p); var q=new Path2D();roundRectP(q,9,9,6,6,1);ctx.stroke(q);
    [9,15].forEach(function(x){line(ctx,x,2,x,5);line(ctx,x,19,x,22);line(ctx,2,x,5,x);line(ctx,19,x,22,x);}); }
  else if(name==='openai'){ p.arc(12,12,9,0,7);ctx.stroke(p);var q=new Path2D();q.arc(12,12,4,0,7);ctx.stroke(q); }
  else if(name==='parser'){ p.moveTo(8,4);p.lineTo(6,4);p.arc(6,6,2,Math.PI*1.5,Math.PI,true);
    ctx.stroke(p); corner(ctx,8,4,1);corner(ctx,16,4,2);corner(ctx,8,20,4);corner(ctx,16,20,3); }
  else if(name==='http'){ p.arc(12,12,9,0,7);ctx.stroke(p);line(ctx,3,12,21,12);
    var e=new Path2D();e.moveTo(12,3);e.bezierCurveTo(15,7,15,17,12,21);e.moveTo(12,3);e.bezierCurveTo(9,7,9,17,12,21);ctx.stroke(e); }
  else if(name==='code'){ p.moveTo(9,8);p.lineTo(5,12);p.lineTo(9,16);p.moveTo(15,8);p.lineTo(19,12);p.lineTo(15,16);ctx.stroke(p); }
  ctx.restore();
}
function roundRectP(p,x,y,w,h,r){p.moveTo(x+r,y);p.arcTo(x+w,y,x+w,y+h,r);p.arcTo(x+w,y+h,x,y+h,r);p.arcTo(x,y+h,x,y,r);p.arcTo(x,y,x+w,y,r);}
function line(ctx,a,b,c,d){var p=new Path2D();p.moveTo(a,b);p.lineTo(c,d);ctx.stroke(p);}
function dot(ctx,a,b,r){var p=new Path2D();p.arc(a,b,r||1.1,0,7);ctx.fill(p);}
function corner(ctx,a,b,q){var p=new Path2D();var dx=q===1||q===4?2:-2, dy=q<3?2:-2;p.moveTo(a+dx,b);p.lineTo(a,b);p.lineTo(a,b+dy);ctx.stroke(p);}

// ════════ MOTOR DE RENDER (canvas único: nodos + líneas juntos) ════════
function makeWorkflow(canvas, style){
  var ctx=canvas.getContext('2d'), DPR=Math.min(devicePixelRatio||1,2);
  var W,H, nodes=JSON.parse(JSON.stringify(NODES)), byId={};
  nodes.forEach(function(n){byId[n.id]=n;});
  function resize(){var r=canvas.getBoundingClientRect();W=r.width;H=r.height;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
    nodes.forEach(function(n){ n.px=n.x*W; n.py=n.y*H;
      n.bw = n.sq?40:(n.w*Math.min(1,W/1100)); n.bh = n.sq?40:(n.core?46:42); });}
  // colores por estilo
  var C = style==='brand'
    ? {line:'rgba(30,64,175,', node:'rgba(20,40,110,', bord:'rgba(60,110,220,', glowN:'rgba(40,90,200,', txt:'#dbe8ff', pulse:'rgba(120,170,255,'}
    : {line:'rgba(120,180,255,', node:'rgba(18,40,86,', bord:'rgba(120,180,255,', glowN:'rgba(70,140,255,', txt:'#eaf4ff', pulse:'rgba(235,245,255,'};
  var GLOW = (style==='clone'||style==='energy')?1 : (style==='clean'?0.45 : 0.6);

  // estado animación
  var pulses=[], shown={}, t0=performance.now();
  nodes.forEach(function(n){ setTimeout(function(){shown[n.id]=true;}, 250+n.step*340); });
  function spawn(){ var e=EDGES[(Math.random()*EDGES.length)|0]; if(!shown[e[0]]||!shown[e[1]])return; pulses.push({a:e[0],b:e[1],t:0,sp:0.5+Math.random()*0.8}); }
  setInterval(spawn, style==='energy'?120:230);

  // geometría de conexión (puertos correctos)
  function ports(A,B){
    var dxN=B.px-A.px, dyN=B.py-A.py, horiz=Math.abs(dxN)>=Math.abs(dyN);
    if(horiz){ return {x1:A.px+A.bw/2,y1:A.py,x2:B.px-B.bw/2,y2:B.py,h:1,s:dxN>=0?1:-1}; }
    return {x1:A.px,y1:A.py+(dyN>=0?A.bh/2:-A.bh/2),x2:B.px,y2:B.py-(dyN>=0?B.bh/2:-B.bh/2),h:0,s:dyN>=0?1:-1};
  }
  function path(P){ // devuelve un Path2D según estilo
    var p=new Path2D();
    if(style==='ortho'){ // ángulo recto con quiebre
      p.moveTo(P.x1,P.y1);
      if(P.h){ var mx=(P.x1+P.x2)/2; p.lineTo(mx,P.y1); p.lineTo(mx,P.y2); p.lineTo(P.x2,P.y2); }
      else { var my=(P.y1+P.y2)/2; p.lineTo(P.x1,my); p.lineTo(P.x2,my); p.lineTo(P.x2,P.y2); }
    } else { // curva bezier
      p.moveTo(P.x1,P.y1);
      if(P.h){ var dx=Math.max(40,Math.abs(P.x2-P.x1)*0.45); p.bezierCurveTo(P.x1+dx*P.s,P.y1,P.x2-dx*P.s,P.y2,P.x2,P.y2); }
      else { var dy=Math.max(34,Math.abs(P.y2-P.y1)*0.5); p.bezierCurveTo(P.x1,P.y1+dy*P.s,P.x2,P.y2-dy*P.s,P.x2,P.y2); }
    }
    return p;
  }
  function pointAt(P,t){ // posición del pulso a lo largo de la conexión
    if(style==='ortho'){
      // 3 tramos iguales aprox
      var pts = P.h ? [[P.x1,P.y1],[(P.x1+P.x2)/2,P.y1],[(P.x1+P.x2)/2,P.y2],[P.x2,P.y2]]
                    : [[P.x1,P.y1],[P.x1,(P.y1+P.y2)/2],[P.x2,(P.y1+P.y2)/2],[P.x2,P.y2]];
      var seg=t*3, i=Math.min(2,Math.floor(seg)), f=seg-i;
      return {x:pts[i][0]+(pts[i+1][0]-pts[i][0])*f, y:pts[i][1]+(pts[i+1][1]-pts[i][1])*f};
    }
    var mt=1-t, c0,c1;
    if(P.h){ var dx=Math.max(40,Math.abs(P.x2-P.x1)*0.45); c0=[P.x1+dx*P.s,P.y1];c1=[P.x2-dx*P.s,P.y2]; }
    else { var dy=Math.max(34,Math.abs(P.y2-P.y1)*0.5); c0=[P.x1,P.y1+dy*P.s];c1=[P.x2,P.y2-dy*P.s]; }
    return { x:mt*mt*mt*P.x1+3*mt*mt*t*c0[0]+3*mt*t*t*c1[0]+t*t*t*P.x2,
             y:mt*mt*mt*P.y1+3*mt*mt*t*c0[1]+3*mt*t*t*c1[1]+t*t*t*P.y2 };
  }

  function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

  function frame(now){
    requestAnimationFrame(frame);
    var T=(now-t0)/1000;
    ctx.clearRect(0,0,W,H);

    // fondo punteado (clone/energy)
    if(style==='clone'||style==='energy'||style==='brand'){
      ctx.fillStyle='rgba(90,140,230,0.10)';
      for(var gx=14;gx<W;gx+=24)for(var gy=14;gy<H;gy+=24){ctx.beginPath();ctx.arc(gx,gy,0.8,0,7);ctx.fill();}
    }

    // ── CONEXIONES ──
    EDGES.forEach(function(e){
      var A=byId[e[0]],B=byId[e[1]]; if(!shown[e[0]]||!shown[e[1]])return;
      var P=ports(A,B), pth=path(P);
      ctx.lineCap='round';ctx.lineJoin='round';
      // dash corriendo (energy)
      if(style==='energy'){ ctx.setLineDash([5,9]); ctx.lineDashOffset=-(T*46)%14; } else ctx.setLineDash([]);
      ctx.strokeStyle=C.line+(0.30*GLOW)+')'; ctx.lineWidth=style==='clean'?3:6; ctx.stroke(pth);  // halo
      ctx.setLineDash([]);
      ctx.strokeStyle=C.line+'0.8)'; ctx.lineWidth=style==='clean'?1.3:2.2; ctx.stroke(pth);        // medio
      if(style!=='clean'){ ctx.strokeStyle='rgba(235,245,255,0.9)'; ctx.lineWidth=0.9; ctx.stroke(pth); } // núcleo
    });

    // ── PULSOS ──
    for(var i=pulses.length-1;i>=0;i--){ var p=pulses[i]; p.t+=0.013*p.sp; if(p.t>=1){pulses.splice(i,1);continue;}
      var A=byId[p.a],B=byId[p.b]; var pt=pointAt(ports(A,B),p.t);
      var R=style==='energy'?17:14;
      var gl=ctx.createRadialGradient(pt.x,pt.y,0,pt.x,pt.y,R);
      gl.addColorStop(0,C.pulse+'1)');gl.addColorStop(0.4,C.line+'0.5)');gl.addColorStop(1,C.line+'0)');
      ctx.fillStyle=gl;ctx.beginPath();ctx.arc(pt.x,pt.y,R,0,7);ctx.fill();
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(pt.x,pt.y,2.2,0,7);ctx.fill();
    }

    // ── NODOS ──
    nodes.forEach(function(n){
      if(!shown[n.id])return;
      var pulse=0.5+0.5*Math.sin(T*1.6 + n.px*0.01);
      var bw=n.bw,bh=n.bh,x=n.px-bw/2,y=n.py-bh/2;
      // glow exterior
      ctx.shadowColor=C.glowN+(0.6*GLOW*(0.7+0.3*pulse))+')';
      ctx.shadowBlur=(n.core?40:24)*GLOW;
      ctx.fillStyle=C.node+'0.92)';
      roundRect(x,y,bw,bh,12); ctx.fill();
      ctx.shadowBlur=0;
      // borde
      ctx.strokeStyle=C.bord+(n.core?0.85:0.55)+')'; ctx.lineWidth=n.core?1.6:1.1;
      roundRect(x,y,bw,bh,12); ctx.stroke();
      // ícono (chip a la izquierda)
      var icx = n.sq? n.px : x+ (n.core?22:20);
      var icy = n.py;
      if(!n.sq){ // fondo del chip del ícono
        ctx.fillStyle=C.glowN+'0.28)'; roundRect(icx-15,icy-15,30,30,8); ctx.fill();
        ctx.strokeStyle=C.bord+'0.5)';ctx.lineWidth=1;roundRect(icx-15,icy-15,30,30,8);ctx.stroke();
      }
      drawIcon(ctx,n.ic, icx, icy, n.sq?20:18, '#dff0ff');
      // texto
      if(!n.sq){
        ctx.textBaseline='middle'; ctx.textAlign='left';
        var tx=icx+24;
        ctx.fillStyle=C.txt; ctx.font='700 '+(n.core?14:12.5)+"px 'Plus Jakarta Sans',sans-serif";
        ctx.fillText(n.label, tx, n.py-6);
        ctx.fillStyle='rgba(150,180,235,0.85)'; ctx.font="600 8.5px 'Plus Jakarta Sans',sans-serif";
        ctx.fillText(n.sub, tx, n.py+8);
      }
      // puertos
      if(style!=='clean'){
        ctx.fillStyle='#cfe6ff';
        ctx.beginPath();ctx.arc(x,n.py,3,0,7);ctx.fill();
        ctx.beginPath();ctx.arc(x+bw,n.py,3,0,7);ctx.fill();
      }
    });
  }
  resize(); addEventListener('resize',resize); requestAnimationFrame(frame);
}
document.querySelectorAll('canvas[data-v]').forEach(function(c){ makeWorkflow(c, c.dataset.v); });
</script>
</body>
</html>
