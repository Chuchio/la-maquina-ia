<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cerebro realista — perfil lateral</title>
<style>
html,body{margin:0;height:100%;overflow:hidden}
body{
  background:
    radial-gradient(120% 95% at 38% 32%, #1d4e8f 0%, #123a72 28%, #0b2553 52%, #07173a 74%, #040d22 100%);
}
#c{display:block;width:100vw;height:100vh;position:relative;z-index:1}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
var V=THREE.Vector3;
function dotTex(){var s=64,c=document.createElement('canvas');c.width=c.height=s;var g=c.getContext('2d');
  var rg=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);rg.addColorStop(0,'rgba(255,255,255,1)');
  rg.addColorStop(0.4,'rgba(210,235,255,0.85)');rg.addColorStop(0.75,'rgba(120,170,255,0.2)');rg.addColorStop(1,'rgba(80,140,255,0)');
  g.fillStyle=rg;g.beginPath();g.arc(s/2,s/2,s/2,0,Math.PI*2);g.fill();return new THREE.CanvasTexture(c);}
function softTex(){var s=64,c=document.createElement('canvas');c.width=c.height=s;var g=c.getContext('2d');
  var rg=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);rg.addColorStop(0,'rgba(150,200,255,0.55)');
  rg.addColorStop(0.5,'rgba(110,160,255,0.18)');rg.addColorStop(1,'rgba(80,140,255,0)');
  g.fillStyle=rg;g.beginPath();g.arc(s/2,s/2,s/2,0,Math.PI*2);g.fill();return new THREE.CanvasTexture(c);}
var TEX=dotTex(), TEXS=softTex();

// ── ruido fractal + domain warping ──
function hash3(x,y,z){var n=Math.sin(x*127.1+y*311.7+z*74.7)*43758.5453;return n-Math.floor(n);}
function vnoise(x,y,z){var xi=Math.floor(x),yi=Math.floor(y),zi=Math.floor(z),xf=x-xi,yf=y-yi,zf=z-zi;
  function f(t){return t*t*(3-2*t);}var u=f(xf),v=f(yf),w=f(zf);function lp(a,b,t){return a+(b-a)*t;}
  return lp(lp(lp(hash3(xi,yi,zi),hash3(xi+1,yi,zi),u),lp(hash3(xi,yi+1,zi),hash3(xi+1,yi+1,zi),u),v),
            lp(lp(hash3(xi,yi,zi+1),hash3(xi+1,yi,zi+1),u),lp(hash3(xi,yi+1,zi+1),hash3(xi+1,yi+1,zi+1),u),v),w);}
function fbm(x,y,z){var s=0,a=0.5,fr=1;for(var o=0;o<4;o++){s+=a*vnoise(x*fr,y*fr,z*fr);fr*=2;a*=0.5;}return s;}
// surcos: ridged + domain warp → patrón serpenteante. Devuelve 0..1 (1=cresta)
function sulci(x,y,z){
  var wx=fbm(x*1.5+1.3,y*1.5+4.2,z*1.5+2.1);
  var wy=fbm(x*1.5+7.1,y*1.5+1.7,z*1.5+9.2);
  var n=fbm(x*2.2+wx*2.4, y*2.2+wy*2.4, z*2.2);
  return 1-Math.abs(2*n-1);
}

/* ── SILUETA DE PERFIL LATERAL ──
   Eje largo = X (frente=+X, occipital=-X). Perfil visible en plano XY (cámara en +Z).
   Devuelve null si la dirección cae fuera de la silueta (para tallar la forma). */
function brainSurface(nx,ny,nz){
  // elipsoide base: largo X, alto Y, fino Z (ancho de la cabeza)
  var x=nx*1.35, y=ny*0.92, z=nz*0.80;
  // base recta abajo (corteza temporal): achatar parte inferior
  if(y<0) y*=0.72;
  // frente alta y bulbosa adelante (+x), occipital que baja atrás (-x)
  y += 0.10*x;                          // inclina: adelante sube
  // lóbulo temporal: saliente adelante-abajo
  var temp=Math.exp(-((x-0.55)*(x-0.55))/0.5 - ((y+0.55)*(y+0.55))/0.18);
  y -= 0.18*temp;
  // estrechar el occipital (atrás) en punta
  var taper=1-0.10*Math.max(0,-x); x*=1; y*= (1-0.04*Math.max(0,-x));

  var rad=Math.sqrt(x*x+y*y+z*z)+1e-5, dr=0;
  // surcos: relieve serpenteante
  var rg=sulci(x,y,z);
  dr += (rg-0.5)*0.22;
  var k=(rad+dr)/rad;
  return new V(x*k,y*k,z*k);
}
function randDir(){var u=Math.random(),v=Math.random();var th=Math.acos(2*u-1),ph=2*Math.PI*v;
  return [Math.sin(th)*Math.cos(ph),Math.cos(th),Math.sin(th)*Math.sin(ph)];}
// muestra superficie con densidad sesgada a crestas
function sampleSurface(){
  for(var t=0;t<8;t++){var d=randDir();var p=brainSurface(d[0],d[1],d[2]);
    var rg=sulci(p.x,p.y,p.z);
    if(Math.random()<0.18+0.82*rg*rg) return p;}
  return brainSurface(0,1,0);
}

var canvas=document.getElementById('c');
var renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true,alpha:true});
renderer.setClearColor(0x000000,0); renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
var scene=new THREE.Scene(); var cam=new THREE.PerspectiveCamera(42,1,0.1,100); cam.position.set(0,0,5);
function resize(){var W=innerWidth,H=innerHeight;renderer.setSize(W,H);cam.aspect=W/H;cam.updateProjectionMatrix();}
resize(); addEventListener('resize',resize);

var g=new THREE.Group(); scene.add(g); g.scale.setScalar(1.55);

// ── ONDAS AL PASAR EL CURSOR ──
// Proyecto el mouse a un plano que pasa por el centro del cerebro (z=0 en mundo),
// lo paso al espacio local del grupo, y lanzo una onda expansiva desde ahí.
var ray=new THREE.Raycaster();
var mouseNDC=new THREE.Vector2();
var hitPlane=new THREE.Plane(new THREE.Vector3(0,0,1),0); // plano z=0 mundo
var ripples=[]; // {p:Vector3 local, t0:tiempo}
var lastRipple=0;
var tmpHit=new THREE.Vector3();
function spawnRipple(clientX,clientY,now){
  mouseNDC.x=(clientX/innerWidth)*2-1;
  mouseNDC.y=-(clientY/innerHeight)*2+1;
  ray.setFromCamera(mouseNDC,cam);
  if(!ray.ray.intersectPlane(hitPlane,tmpHit)) return;
  // a espacio local del grupo (deshace scale + rotación actuales)
  var local=g.worldToLocal(tmpHit.clone());
  // solo si cae razonablemente dentro/cerca del cerebro
  if(local.length()>1.9) return;
  ripples.push({p:local, t0:now});
  if(ripples.length>6) ripples.shift(); // límite para performance
}
addEventListener('pointermove',function(e){
  var now=performance.now()/1000;
  if(now-lastRipple<0.09) return; // throttle: no spamear ondas
  lastRipple=now;
  spawnRipple(e.clientX,e.clientY,now);
});

// ── 1) PARTÍCULAS: 3 capas para densidad + volumen (hiperrealista) ──
// (a) capa GLOW difusa: da masa/volumen translúcido al cerebro
var NG=4200, ag=new Float32Array(NG*3);
for(var i=0;i<NG;i++){var p=sampleSurface();
  // empujar un poco hacia adentro de forma aleatoria → da grosor/volumen
  var r=0.86+Math.random()*0.16; ag[i*3]=p.x*r;ag[i*3+1]=p.y*r;ag[i*3+2]=p.z*r;}
var ggeo=new THREE.BufferGeometry(); ggeo.setAttribute('position',new THREE.BufferAttribute(ag,3));
var matGlow=new THREE.PointsMaterial({color:0x7cc0ff,size:0.12,map:TEXS,transparent:true,opacity:0.60,blending:THREE.AdditiveBlending,depthWrite:false});
g.add(new THREE.Points(ggeo,matGlow));

// (b) capa DENSA fina: textura de la corteza (muchas partículas chiquitas)
var ND=9000, ad=new Float32Array(ND*3), adBase=new Float32Array(ND*3);
for(var i=0;i<ND;i++){var p=sampleSurface();ad[i*3]=p.x;ad[i*3+1]=p.y;ad[i*3+2]=p.z;
  adBase[i*3]=p.x;adBase[i*3+1]=p.y;adBase[i*3+2]=p.z;}
var dgeo=new THREE.BufferGeometry(); dgeo.setAttribute('position',new THREE.BufferAttribute(ad,3));
var matDense=new THREE.PointsMaterial({color:0xcfeaff,size:0.024,map:TEX,transparent:true,opacity:1.0,blending:THREE.AdditiveBlending,depthWrite:false});
var densePts=new THREE.Points(dgeo,matDense); g.add(densePts);

// (c) capa NEURONAS brillantes: destellos blancos dispersos (como la referencia)
var N=520, arr=new Float32Array(N*3), phase=new Float32Array(N);
for(var i=0;i<N;i++){var p=sampleSurface();arr[i*3]=p.x;arr[i*3+1]=p.y;arr[i*3+2]=p.z;phase[i]=Math.random()*6.283;}
var geo=new THREE.BufferGeometry(); geo.setAttribute('position',new THREE.BufferAttribute(arr,3));
var matPts=new THREE.PointsMaterial({color:0xffffff,size:0.072,map:TEX,transparent:true,opacity:1.0,blending:THREE.AdditiveBlending,depthWrite:false});
g.add(new THREE.Points(geo,matPts));

// ── 2) LÍNEAS CURVAS DE SURCOS (gyri) sobre la superficie ──
// Para cada semilla: caminar siguiendo una dirección tangente perturbada por sulci,
// reproyectando a la superficie cada paso → trazo curvo pegado a la corteza.
function gradSulci(p){ // gradiente numérico de sulci en superficie
  var e=0.04;
  var gx=sulci(p.x+e,p.y,p.z)-sulci(p.x-e,p.y,p.z);
  var gy=sulci(p.x,p.y+e,p.z)-sulci(p.x,p.y-e,p.z);
  var gz=sulci(p.x,p.y,p.z+e)-sulci(p.x,p.y,p.z-e);
  return new V(gx,gy,gz);
}
/* Líneas de surcos como CURVAS DE CONTORNO onduladas:
   recorro la superficie variando el ángulo polar (theta) a un azimut fijo (phi),
   ondulando phi con sulci → gyri serpenteantes pegados a la corteza, sin cruzar el interior.
   Hago varias "bandas" a distintos phi cubriendo todo el perfil. */
/* Surcos: curvas que recorren la superficie a azimut casi-fijo, onduladas con
   sulci → gyri. Pocas y suaves para que se lean como pliegues, no como red. */
var lineVerts=[];
var BANDS=16, SAMP=30;
for(var bi=0;bi<BANDS;bi++){
  var phi0=(bi/BANDS)*Math.PI*2;
  var amp=0.14+Math.random()*0.16;
  var freq=2.0+Math.random()*2.5;
  var ph0=Math.random()*6.28;
  var th0=0.2, th1=Math.PI-0.2;
  var prev=null;
  for(var s=0;s<SAMP;s++){
    var u=s/(SAMP-1);
    var th=th0+(th1-th0)*u;
    var ph=phi0 + amp*Math.sin(u*freq*Math.PI*2+ph0);
    var nx=Math.sin(th)*Math.cos(ph), ny=Math.cos(th), nz=Math.sin(th)*Math.sin(ph);
    var sp=brainSurface(nx,ny,nz); sp.multiplyScalar(1.01);
    if(prev) lineVerts.push(prev.x,prev.y,prev.z, sp.x,sp.y,sp.z);
    prev=sp;
  }
}
var lgeo=new THREE.BufferGeometry(); lgeo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(lineVerts),3));
var matLines=new THREE.LineBasicMaterial({color:0x9ad4ff,transparent:true,opacity:0.55,blending:THREE.AdditiveBlending,depthWrite:false});
g.add(new THREE.LineSegments(lgeo,matLines));

// ── IMPULSOS: puntos brillantes que viajan por las bandas de surcos ──
// Reconstruyo cada banda como una polyline continua (path) para animar a lo largo.
var paths=[];
(function buildPaths(){
  for(var bi=0;bi<BANDS;bi++){
    var phi0=(bi/BANDS)*Math.PI*2;
    // mismos parámetros aleatorios no se conservan; regenero caminos suaves deterministas
    var amp=0.14+((bi*0.37)%1)*0.16;
    var freq=2.0+((bi*0.61)%1)*2.5;
    var ph0=(bi*1.7)%6.28;
    var th0=0.2, th1=Math.PI-0.2;
    var pts=[];
    for(var s=0;s<SAMP;s++){
      var u=s/(SAMP-1);
      var th=th0+(th1-th0)*u;
      var ph=phi0 + amp*Math.sin(u*freq*Math.PI*2+ph0);
      var nx=Math.sin(th)*Math.cos(ph), ny=Math.cos(th), nz=Math.sin(th)*Math.sin(ph);
      var sp=brainSurface(nx,ny,nz); sp.multiplyScalar(1.012);
      pts.push(sp);
    }
    paths.push(pts);
  }
})();
// nube de impulsos: cada uno tiene un path asignado, posición t (0..1) y velocidad
var NP=46;
var impArr=new Float32Array(NP*3);
var imp=[];
for(var i=0;i<NP;i++){
  imp.push({path:(Math.random()*paths.length)|0, t:Math.random(), v:0.05+Math.random()*0.10});
}
var impGeo=new THREE.BufferGeometry(); impGeo.setAttribute('position',new THREE.BufferAttribute(impArr,3));
var matImp=new THREE.PointsMaterial({color:0xeaf6ff,size:0.10,map:TEX,transparent:true,opacity:0.95,blending:THREE.AdditiveBlending,depthWrite:false});
g.add(new THREE.Points(impGeo,matImp));
function updateImpulses(dt){
  for(var i=0;i<NP;i++){
    var o=imp[i]; o.t+=o.v*dt;
    if(o.t>=1){ o.t=0; o.path=(Math.random()*paths.length)|0; o.v=0.05+Math.random()*0.10; }
    var P=paths[o.path]; var f=o.t*(P.length-1); var k=f|0; var fr=f-k;
    var a=P[k], b=P[Math.min(k+1,P.length-1)];
    impArr[i*3]=a.x+(b.x-a.x)*fr;
    impArr[i*3+1]=a.y+(b.y-a.y)*fr;
    impArr[i*3+2]=a.z+(b.z-a.z)*fr;
  }
  impGeo.attributes.position.needsUpdate=true;
}

// ── 3) CEREBELO: bulto estriado abajo-atrás ──
var cb=new THREE.Group(); g.add(cb);
var cbCenter=new V(-0.92,-0.45,0);
var cl=[];
for(var i=0;i<26;i++){ // estrías (líneas paralelas curvas)
  var ang=(-0.5+i/26)*Math.PI*0.9;
  var seg=[];
  for(var s=0;s<10;s++){
    var u=s/9;
    var r=0.34*(1-0.25*Math.abs(0.5-u)*2);
    var px=cbCenter.x + Math.cos(ang)*r*0.9 - 0.12*u;
    var py=cbCenter.y + (u-0.5)*0.7;
    var pz=Math.sin(ang)*r*0.85;
    seg.push(px,py,pz);
  }
  for(var s=0;s<9;s++){cl.push(seg[s*3],seg[s*3+1],seg[s*3+2],seg[(s+1)*3],seg[(s+1)*3+1],seg[(s+1)*3+2]);}
}
var clgeo=new THREE.BufferGeometry(); clgeo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(cl),3));
cb.add(new THREE.LineSegments(clgeo,new THREE.LineBasicMaterial({color:0x5aa6ff,transparent:true,opacity:0.4,blending:THREE.AdditiveBlending,depthWrite:false})));
// puntos del cerebelo (más densos)
var M=1800, ca=new Float32Array(M*3);
for(var i=0;i<M;i++){var d=randDir();var r=0.34*Math.sqrt(Math.random());
  ca[i*3]=cbCenter.x+d[0]*r; ca[i*3+1]=cbCenter.y+d[1]*r*0.85; ca[i*3+2]=cbCenter.z+d[2]*r*0.8;}
var cgeo=new THREE.BufferGeometry(); cgeo.setAttribute('position',new THREE.BufferAttribute(ca,3));
cb.add(new THREE.Points(cgeo,new THREE.PointsMaterial({color:0xbfe6ff,size:0.02,map:TEX,transparent:true,opacity:0.85,blending:THREE.AdditiveBlending,depthWrite:false})));

// ── 4) TRONCO ENCEFÁLICO: columna abajo, saliendo hacia adelante-abajo ──
var stem=[], sp0=new V(-0.55,-0.55,0);
var STEM_LEN=1.25, STEM_DX=0.16, STEM_RAD=0.34; // más larga y gruesa (la "vértebra")
for(var s=0;s<12;s++){var u=s/11; var px=sp0.x+STEM_DX*u; var py=sp0.y-STEM_LEN*u; var pz=0;
  stem.push(px,py,pz); }
var stemSeg=[];
for(var s=0;s<11;s++){stemSeg.push(stem[s*3],stem[s*3+1],stem[s*3+2],stem[(s+1)*3],stem[(s+1)*3+1],stem[(s+1)*3+2]);}
// engrosar el tronco con puntos (más densos, más anchos)
var stemPts=[];
for(var i=0;i<1500;i++){var u=Math.random();
  var rad=STEM_RAD*(1-0.30*u); // se afina un poco hacia abajo
  var px=sp0.x+STEM_DX*u+(Math.random()-0.5)*rad;
  var py=sp0.y-STEM_LEN*u;
  var pz=(Math.random()-0.5)*rad;
  stemPts.push(px,py,pz);}
var sgeo=new THREE.BufferGeometry(); sgeo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(stemPts),3));
g.add(new THREE.Points(sgeo,new THREE.PointsMaterial({color:0x9ad0ff,size:0.030,map:TEX,transparent:true,opacity:0.9,blending:THREE.AdditiveBlending,depthWrite:false})));

// ── VISTA DE PERFIL LATERAL (frente a la derecha) + oscilación muy leve ──
// el eje largo del cerebro es X; al mirar desde +Z vemos el perfil completo.
g.rotation.y=0.0;
var clock=new THREE.Clock(),T=0;
(function loop(){requestAnimationFrame(loop);var dt=clock.getDelta();T+=dt;
  // oscilación sutil: mantiene el perfil legible, solo insinúa volumen 3D
  g.rotation.y=Math.sin(T*0.12)*0.10;
  g.rotation.x=Math.sin(T*0.10)*0.025;
  matPts.opacity=0.85+0.15*Math.sin(T*1.6);      // neuronas titilan en conjunto
  matGlow.opacity=0.52+0.12*Math.sin(T*0.9);     // glow respira
  matLines.opacity=0.5+0.12*Math.sin(T*1.1);
  matImp.opacity=0.85+0.15*Math.sin(T*5.0);      // impulsos pulsan
  updateImpulses(dt);                            // impulsos viajan por los surcos
  updateRipples(T);                              // ondas expansivas del cursor
  renderer.render(scene,cam);})();

// ── perturbación LOCAL en el punto del cursor (no una onda que se propaga) ──
var RIP_RADIUS=0.30;  // radio de influencia: solo partículas muy cerca del mouse
var RIP_PUSH=0.10;    // cuánto empuja hacia afuera (sutil)
var RIP_LIFE=0.6;     // dura poquito: aparece y se desvanece ahí mismo
function updateRipples(T){
  for(var r=ripples.length-1;r>=0;r--){ if(T-ripples[r].t0>RIP_LIFE) ripples.splice(r,1); }
  var pos=dgeo.attributes.position.array;
  for(var i=0;i<ND;i++){
    var bx=adBase[i*3], by=adBase[i*3+1], bz=adBase[i*3+2];
    var dx=0,dy=0,dz=0;
    for(var r=0;r<ripples.length;r++){
      var R=ripples[r], age=T-R.t0;
      var ex=bx-R.p.x, ey=by-R.p.y, ez=bz-R.p.z;
      var dist=Math.sqrt(ex*ex+ey*ey+ez*ez)+1e-5;
      if(dist>RIP_RADIUS) continue;               // SOLO el pedacito cercano al cursor
      var falloff=Math.exp(-(dist*dist)/(RIP_RADIUS*RIP_RADIUS*0.35)); // burbuja localizada
      // pulso suave: crece y se va dentro de RIP_LIFE
      var pulse=Math.sin((age/RIP_LIFE)*Math.PI);
      var amp=falloff*Math.max(0,pulse);
      var k=RIP_PUSH*amp/dist;
      dx+=ex*k; dy+=ey*k; dz+=ez*k;
    }
    pos[i*3]=bx+dx; pos[i*3+1]=by+dy; pos[i*3+2]=bz+dz;
  }
  dgeo.attributes.position.needsUpdate=true;
}
</script>
</body>
</html>
